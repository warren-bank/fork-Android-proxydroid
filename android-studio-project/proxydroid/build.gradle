apply from: '../constants.gradle'
apply plugin: 'com.android.application'

android {
  namespace project.ext.applicationId

  compileSdkVersion project.ext.compileSdkVersion
  buildToolsVersion project.ext.buildToolsVersion
  ndkVersion        project.ext.ndkVersion

  compileOptions {
    sourceCompatibility project.ext.javaVersion
    targetCompatibility project.ext.javaVersion
  }

  defaultConfig {
    minSdkVersion    project.ext.minSdkVersion
    targetSdkVersion project.ext.targetSdkVersion

    applicationId project.ext.applicationId
    versionName   project.ext.releaseVersion
    versionCode   project.ext.releaseVersionCode

    archivesBaseName += "-$versionName"

    ndk {
      abiFilters.clear()

      //note: only include the following when NOT using: android.splits.abi.include
      //abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
    }
  }

  flavorDimensions "languageResources"

  productFlavors {
    withAllLanguageTranslations {
      dimension "languageResources"
    }
    english {
      dimension "languageResources"
    }
  }

  buildTypes {
    release {
      debuggable      false
      jniDebuggable   false
      minifyEnabled   true
      shrinkResources true
      proguardFiles = [
        "proguard-rules.txt",
        getDefaultProguardFile('proguard-android.txt')
      ]
    }
    debug {
      debuggable      true
      jniDebuggable   true
      minifyEnabled   false
      shrinkResources false
    }
  }

  buildFeatures {
    aidl        false
    buildConfig false
  }

  externalNativeBuild {
    cmake {
      version project.ext.cmakeVersion
      path "src/main/cpp/CMakeLists.txt"
    }
  }

  splits {
    abi {
      enable true
      reset()
      include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
      universalApk true
    }
  }

  dependenciesInfo {
    includeInApk    = false  // Disables dependency metadata when building APKs.
    includeInBundle = false  // Disables dependency metadata when building Android App Bundles.
  }

  lintOptions {
    disable 'MissingTranslation'
    abortOnError true
  }
}

// https://stackoverflow.com/questions/57645919
// https://docs.gradle.org/current/dsl/org.gradle.api.artifacts.DependencySubstitutions.html
configurations.all {
  resolutionStrategy.dependencySubstitution {
    substitute module('org.hamcrest:hamcrest-core:1.1') using module('junit:junit:4.10')
  }
}

dependencies {
  implementation 'com.googlecode.json-simple:json-simple:'  + project.ext.libJsonSimpleVersion  // ( 23 KB) https://mvnrepository.com/artifact/com.googlecode.json-simple/json-simple
  implementation 'org.mozilla:rhino:'                       + project.ext.libRhinoVersion       // (1.3 MB) https://mvnrepository.com/artifact/org.mozilla/rhino
}
